services:
  api-proxy:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}

    container_name: api-proxy
    restart: unless-stopped
    ports:
      - "3000:3000"

    env_file:
      - .env

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://localhost:3000/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3